<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHO-QATD LIMS - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #content-frame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden">

    <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex flex-col flex-shrink-0">

        <!-- Brand -->
        <div class="p-5 border-b border-slate-700/60">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-white rounded-xl flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid fa-flask-vial text-sky-600 text-base"></i>
                </div>
                <div>
                    <div class="font-black text-sm leading-tight">PHO-QATD LIMS</div>
                    <div class="text-[10px] text-slate-400 leading-tight">Admin Portal</div>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav id="nav-menu" class="flex-1 p-3 space-y-1 overflow-y-auto">
            <!-- Populated by renderMenu() -->
        </nav>

        <!-- User info + logout -->
        <div class="p-4 border-t border-slate-700/60">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2 min-w-0">
                    <div class="w-7 h-7 rounded-full bg-slate-700 flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid fa-user text-slate-300 text-xs"></i>
                    </div>
                    <span id="current-role-label" class="text-xs text-slate-300 truncate font-medium">—</span>
                </div>
                <button onclick="logout()"
                    title="Log out"
                    class="text-slate-400 hover:text-rose-400 transition p-1.5 rounded-lg hover:bg-slate-800 flex-shrink-0 ml-2">
                    <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
                </button>
            </div>
        </div>

    </aside>

    <!-- ── Main content (iframe) ────────────────────────────────────────────── -->
    <main class="flex-1 flex flex-col overflow-hidden">

        <!-- Top bar -->
        <header class="h-12 bg-white border-b border-slate-200 flex items-center px-5 flex-shrink-0">
            <span id="page-breadcrumb" class="text-xs text-slate-500 font-medium">Select a module from the sidebar</span>
        </header>

        <!-- iframe area -->
        <div class="flex-1 overflow-hidden bg-slate-100">
            <!-- Welcome screen shown when no page is loaded -->
            <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center p-8">
                <div class="w-16 h-16 bg-white rounded-2xl shadow-md flex items-center justify-center mb-5">
                    <i class="fa-solid fa-flask-vial text-2xl text-sky-600"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-800 mb-2">Welcome to PHO-QATD LIMS</h2>
                <p class="text-sm text-slate-500 max-w-sm">Select a module from the left sidebar to get started.</p>
            </div>
            <iframe id="content-frame" class="hidden w-full h-full border-none"></iframe>
        </div>

    </main>

    <script src="../shared/js/storage-service.js"></script>
    <script src="../shared/js/role-service.js"></script>
    <script>
        // ── Bootstrap ─────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', function () {
            const role = StorageService.getUserRole();

            // Redirect to login if no role is set
            if (!role) {
                window.location.href = 'login.html';
                return;
            }

            // Display role label
            const roleLabel = ROLE_LABELS[role] || role;
            document.getElementById('current-role-label').textContent = roleLabel;

            // Render sidebar menu for this role
            const navEl = document.getElementById('nav-menu');
            renderMenu(role, navEl, function (menuItem) {
                loadPage(menuItem);
            });

            // If role has no permitted pages, show a notice
            const allowed = ROLE_PERMISSIONS[role] || [];
            if (allowed.length === 0) {
                document.getElementById('welcome-screen').innerHTML =
                    '<p class="text-slate-500 text-sm">No modules available for your role.</p>';
            }
        });

        // ── Load page into iframe ─────────────────────────────────────────────
        function loadPage(menuItem) {
            const iframe = document.getElementById('content-frame');
            const welcome = document.getElementById('welcome-screen');
            const breadcrumb = document.getElementById('page-breadcrumb');

            iframe.src = 'pages/' + menuItem.file;
            iframe.classList.remove('hidden');
            welcome.classList.add('hidden');
            breadcrumb.textContent = menuItem.label;
        }

        // ── Logout ────────────────────────────────────────────────────────────
        function logout() {
            StorageService.clearSession();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
