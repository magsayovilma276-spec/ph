<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHO-QATD LIMS - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center font-sans antialiased p-4">

    <div class="w-full max-w-md">

        <!-- Logo & Title -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl shadow-xl mb-4">
                <i class="fa-solid fa-flask-vial text-2xl text-sky-600"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">PHO-QATD LIMS</h1>
            <p class="text-slate-400 text-sm mt-1">Admin Portal — Select your role to continue</p>
        </div>

        <!-- Role Selection Cards -->
        <div class="space-y-3" id="role-cards">

            <!-- Administrator -->
            <button onclick="selectRole('admin')"
                class="w-full flex items-center space-x-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-sky-500 rounded-2xl p-4 text-left transition-all duration-200 group">
                <div class="w-12 h-12 rounded-xl bg-sky-500/10 border border-sky-500/30 flex items-center justify-center flex-shrink-0 group-hover:bg-sky-500/20 transition">
                    <i class="fa-solid fa-user-shield text-sky-400 text-lg"></i>
                </div>
                <div class="flex-1">
                    <div class="text-white font-bold text-sm">Administrator</div>
                    <div class="text-slate-400 text-xs mt-0.5">Full access to all modules</div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-sky-400 transition"></i>
            </button>

            <!-- Cashier -->
            <button onclick="selectRole('cashier')"
                class="w-full flex items-center space-x-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-emerald-500 rounded-2xl p-4 text-left transition-all duration-200 group">
                <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center flex-shrink-0 group-hover:bg-emerald-500/20 transition">
                    <i class="fa-solid fa-file-invoice-dollar text-emerald-400 text-lg"></i>
                </div>
                <div class="flex-1">
                    <div class="text-white font-bold text-sm">Cashier</div>
                    <div class="text-slate-400 text-xs mt-0.5">Billing confirmation and payment processing</div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-emerald-400 transition"></i>
            </button>

            <!-- Lab Technician -->
            <button onclick="selectRole('lab_technician')"
                class="w-full flex items-center space-x-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-violet-500 rounded-2xl p-4 text-left transition-all duration-200 group">
                <div class="w-12 h-12 rounded-xl bg-violet-500/10 border border-violet-500/30 flex items-center justify-center flex-shrink-0 group-hover:bg-violet-500/20 transition">
                    <i class="fa-solid fa-microscope text-violet-400 text-lg"></i>
                </div>
                <div class="flex-1">
                    <div class="text-white font-bold text-sm">Lab Technician</div>
                    <div class="text-slate-400 text-xs mt-0.5">Chain of custody, testing, certificates, and reports</div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-violet-400 transition"></i>
            </button>

        </div>

        <!-- Footer note -->
        <p class="text-center text-slate-600 text-xs mt-8">
            Province of Surigao del Sur &mdash; Quality Assurance and Testing Division
        </p>

    </div>

    <script src="../shared/js/storage-service.js"></script>
    <script>
        function selectRole(role) {
            StorageService.setUserRole(role);
            window.location.href = 'index.html';
        }

        // If already logged in, redirect to admin dashboard
        document.addEventListener('DOMContentLoaded', function () {
            const existingRole = StorageService.getUserRole();
            if (existingRole) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
